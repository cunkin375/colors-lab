name: Lint JavaScript

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js for linting
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install lint dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
